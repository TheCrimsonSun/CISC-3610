<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gensokyo Archive – Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    body { background: #0d0618; color: #e2d9f3; font-family: 'Crimson Pro', serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; }
    h1 { font-family: 'Cinzel Decorative', serif; color: #c084fc; font-size: clamp(1.8rem,5vw,3rem); margin-bottom: 16px; }
    p { color: #7c6a9a; font-size: 1.15rem; max-width: 520px; margin-bottom: 36px; line-height: 1.7; font-style: italic; }
    .orb { width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #c084fc, #4c1d95, #1a0d33); box-shadow: 0 0 60px rgba(192,132,252,0.5); margin: 0 auto 28px; }
    .links { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
    .links a { padding: 12px 28px; border-radius: 99px; text-decoration: none; font-family: 'Crimson Pro', serif; font-size: 1.05rem; transition: all 0.2s; }
    .btn-main { background: linear-gradient(135deg, #7c3aed, #be185d); color: #fff; box-shadow: 0 4px 20px rgba(124,58,237,0.4); }
    .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(124,58,237,0.55); color: #fff; }
    .btn-outline { border: 1px solid rgba(192,132,252,0.3); color: #c084fc; }
    .btn-outline:hover { background: rgba(192,132,252,0.1); color: #c084fc; }
    #installBtn { display: none; }
    #installBtn.show { display: inline-block; }
  </style>
</head>
<body>
  <div class="orb"></div>
  <h1>Gensokyo Archive</h1>
  <p>An interactive Touhou Project character encyclopedia. Learn about the residents of Gensokyo — installable, offline-ready, and free.</p>
  <div class="links">
    <a href="index.html" class="btn-main">⛩ Launch the App</a>
    <button id="installBtn" class="btn-main" style="border: none; cursor: pointer;">📲 Install PWA</button>
    <a href="promo.html" class="btn-outline">📄 About &amp; Install Guide</a>
    <a href="user-docs.html" class="btn-outline">📖 User Documentation</a>
    <a href="programmer-docs.html" class="btn-outline">🛠 Programmer Docs</a>
  </div>

  <script>
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.add('show');
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response to the install prompt: ${outcome}`);
        deferredPrompt = null;
        installBtn.classList.remove('show');
      }
    });

    window.addEventListener('appinstalled', () => {
      console.log('PWA was installed');
    });
  </script>
</body>
</html>

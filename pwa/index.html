<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1d2f4b">
  <title>PWA Touhou</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
</head>

<body>
  <header>
    <div>
      <h1>PWA Touhou</h1>
    </div>
    <button id="installButton" class="hidden">Install App</button>
  </header>

  <main>
    <section class="intro">
      <p>Choose a topic from the menu to explore and learn about 5 different characters.</p>
      <div class="status-bar">
        <span><strong>Connection:</strong> <span id="offlineStatus">Online</span></span>
        <span><strong>App status:</strong> <span id="cacheStatus">Ready</span></span>
      </div>
    </section>

    <div class="layout">
      <aside class="topic-menu">
        <h2>Topics</h2>
        <ul id="topicList"></ul>
      </aside>

      <section class="topic-detail" id="topicCard">
        <p>Loading topics…</p>
      </section>
    </div>
  </main>

  <footer>
    <p>Touhou PWA.</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
